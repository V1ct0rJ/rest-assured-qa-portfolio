# ======================================================
# 1. Allure Report Integráció
# ======================================================
cucumber.plugin=io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm

# ======================================================
# 2. JUnit 5 (Jupiter) Párhuzamosítás
# ======================================================
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Szálkezelés: Dinamikus (CPU magok száma * factor)
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1.0

# ======================================================
# 3. Cucumber BDD Párhuzamosítás
# ======================================================
# Engedélyezi, hogy a Cucumber Scenariók párhuzamosan fussanak
cucumber.execution.parallel.enabled=true