# Párhuzamos tesztfuttatás engedélyezése JUnit 5 alatt
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Szálkezelési stratégia (automatikusan a processzormagok számához igazodik)
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1

# Párhuzamos végrehajtás engedélyezése
cucumber.execution.parallel.enabled=true

# A szálak számának dinamikus beállítása a CPU magok alapján (vagy fix szám)
cucumber.execution.parallel.config.strategy=dynamic
cucumber.execution.parallel.config.dynamic.factor=1.0

# Ha a feature fájlokon belül a scenariókat is párhuzamosan akarjuk futtatni:
cucumber.execution.parallel.config.strategy.fixed.parallelism=4