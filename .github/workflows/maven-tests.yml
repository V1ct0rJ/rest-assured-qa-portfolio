name: Umbrella API Tests with Allure

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Meghagytuk a manuális indítás lehetőségét!

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests with Maven
        run: mvn clean test

      # ÚJ LÉPÉS: Allure riport generálása a tesztfutás után
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      # EREDETI LÉPÉS: Megtartjuk a Cucumber HTML riport feltöltését is
      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-reports/cucumber.html

      # ÚJ LÉPÉS: Az Allure weboldal fájljainak feltöltése
      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-execution-report
          path: target/site/allure-maven-plugin